[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "email-threat-detector"
version = "0.1.0"
description = "ThreatLens web app for spam and phishing message classification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Mehdi Hellal" }
]
dependencies = [
  "joblib>=1.4",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]
distilbert-runtime = [
  "safetensors>=0.4",
  "torch>=2.3",
  "transformers>=4.46,<6",
]
distilbert-training = [
  "accelerate>=1.0",
  "datasets>=3.0",
  "numpy>=1.26",
  "pandas>=2.2",
  "safetensors>=0.4",
  "torch>=2.3",
  "transformers>=4.46,<6",
]
dev = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.8",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
threatlens-distilbert = "email_threat_detector.distilbert_training:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_threat_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --basetemp=.pytest-tmp --cov=web.backend --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["web/backend"]

[tool.coverage.report]
show_missing = true
skip_covered = false
