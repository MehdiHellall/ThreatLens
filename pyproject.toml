[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "email-threat-detector"
version = "0.1.0"
description = "ThreatLens web app for spam and phishing message classification."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
  { name = "Mehdi Hellal" }
]
dependencies = [
  "joblib==1.6.0",
  "scikit-learn==1.9.0",
]

[project.optional-dependencies]
web = [
  "fastapi==0.142.2",
  "pydantic==2.13.5",
  "uvicorn[standard]==0.54.0",
]
distilbert-runtime = [
  "safetensors==0.8.0",
  "torch==2.13.0",
  "transformers==5.14.1",
]
distilbert-training = [
  "accelerate==1.14.0",
  "datasets==5.0.1",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "transformers==5.14.1",
]
dev = [
  "fastapi==0.142.2",
  "httpx2==2.0.0",
  "numpy==2.5.1",
  "pandas==3.0.5",
  "pydantic==2.13.5",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.9",
  "uvicorn[standard]==0.54.0",
]

[project.scripts]
threatlens-distilbert = "email_threat_detector.distilbert_training:main"
threatlens-artifacts = "email_threat_detector.artifact_validation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_threat_detector"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --basetemp=.pytest-tmp --cov=web.backend --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
branch = true
source = ["web/backend"]

[tool.coverage.report]
show_missing = true
skip_covered = false
