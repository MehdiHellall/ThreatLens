version: "3"

tasks:
  default:
    desc: List available project tasks
    cmds:
      - task --list

  doctor:
    desc: Check Docker, Compose, Git LFS, resources, and model artifacts
    cmds:
      - python3 scripts/threatlens.py doctor

  demo:
    desc: Build, start, and verify the real two-model demo
    cmds:
      - python3 scripts/threatlens.py demo

  app:
    desc: Compatibility alias for the verified demo workflow
    cmds:
      - task: demo

  logs:
    desc: Follow application logs
    cmds:
      - python3 scripts/threatlens.py logs

  down:
    desc: Stop the app without deleting model artifacts or caches
    cmds:
      - python3 scripts/threatlens.py down

  share:
    desc: Share the running demo with a free Tailscale Funnel URL
    cmds:
      - python3 scripts/threatlens.py share

  unshare:
    desc: Disable only the ThreatLens Funnel mapping
    cmds:
      - python3 scripts/threatlens.py unshare

  backend:
    desc: Run FastAPI locally with reload
    cmds:
      - python3 scripts/threatlens.py backend

  frontend:
    desc: Run Vite locally with its /api proxy
    cmds:
      - python3 scripts/threatlens.py frontend

  test:
    desc: Run backend tests and coverage
    cmds:
      - python3 scripts/threatlens.py test

  lint:
    desc: Run Ruff and ESLint
    cmds:
      - python3 scripts/threatlens.py lint

  format-check:
    desc: Check Python formatting
    cmds:
      - python3 scripts/threatlens.py format-check

  build:
    desc: Build the frontend
    cmds:
      - python3 scripts/threatlens.py build

  e2e:
    desc: Run Playwright end-to-end tests
    cmds:
      - python3 scripts/threatlens.py e2e

  clean-dry-run:
    desc: Preview safe cleanup without deleting anything
    cmds:
      - python3 scripts/threatlens.py clean

  clean:
    desc: Remove only allowlisted build and test outputs
    prompt: This removes disposable caches and test/build outputs. Continue?
    cmds:
      - python3 scripts/threatlens.py clean --execute
