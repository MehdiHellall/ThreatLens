map $server_port $threatlens_client_ip {
  default $remote_addr;
  8443 $proxy_protocol_addr;
}

map $server_port $threatlens_forwarded_proto {
  default $scheme;
  8443 https;
}

server {
  listen 8080;
  listen 8443 proxy_protocol;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 16k;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /api {
    default_type application/json;
    return 404 '{"detail":"API route not found."}';
  }

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $threatlens_client_ip;
    proxy_set_header X-Forwarded-For $threatlens_client_ip;
    proxy_set_header X-Forwarded-Proto $threatlens_forwarded_proto;
    proxy_connect_timeout 3s;
    proxy_send_timeout 35s;
    proxy_read_timeout 35s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri =404;
  }
}
