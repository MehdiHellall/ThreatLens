services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    environment:
      EMAIL_THREAT_MODEL_PATH: ${EMAIL_THREAT_MODEL_PATH-artifacts/tfidf_logreg.joblib}
      EMAIL_THREAT_MODEL_URL: ${EMAIL_THREAT_MODEL_URL:-}
      EMAIL_THREAT_MODEL_SHA256: ${EMAIL_THREAT_MODEL_SHA256:-}
      EMAIL_THREAT_MODEL_CACHE_PATH: ${EMAIL_THREAT_MODEL_CACHE_PATH:-/tmp/threatlens/model.joblib}
      EMAIL_THREAT_MODEL_RETRY_SECONDS: ${EMAIL_THREAT_MODEL_RETRY_SECONDS:-30}
      EMAIL_THREAT_MAX_ARTIFACT_BYTES: ${EMAIL_THREAT_MAX_ARTIFACT_BYTES:-1073741824}
      EMAIL_THREAT_DISTILBERT_MODEL_PATH: ${EMAIL_THREAT_DISTILBERT_MODEL_PATH:-artifacts/distilbert}
      EMAIL_THREAT_DISTILBERT_MODEL_URL: ${EMAIL_THREAT_DISTILBERT_MODEL_URL:-}
      EMAIL_THREAT_DISTILBERT_MODEL_SHA256: ${EMAIL_THREAT_DISTILBERT_MODEL_SHA256:-}
      EMAIL_THREAT_DISTILBERT_MODEL_CACHE_PATH: ${EMAIL_THREAT_DISTILBERT_MODEL_CACHE_PATH:-/tmp/threatlens/distilbert}
      EMAIL_THREAT_DISTILBERT_MAX_LENGTH: ${EMAIL_THREAT_DISTILBERT_MAX_LENGTH:-128}
      EMAIL_THREAT_BACKGROUND_WARMUP: ${EMAIL_THREAT_BACKGROUND_WARMUP:-true}
      EMAIL_THREAT_RATE_LIMIT_PER_MINUTE: ${EMAIL_THREAT_RATE_LIMIT_PER_MINUTE:-60}
      EMAIL_THREAT_MAX_BODY_BYTES: ${EMAIL_THREAT_MAX_BODY_BYTES:-16384}
      EMAIL_THREAT_ALLOWED_ORIGINS: ${EMAIL_THREAT_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
    ports:
      - "8000:8000"
    volumes:
      # Model artifacts are mounted read-only so the image stays small.
      - ./artifacts:/app/artifacts:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/live', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: web/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
