name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff-pytest:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"

    steps:
      - name: Check out repository with LFS artifacts
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked development environment
        run: |
          python -m pip install uv==0.12.21
          uv sync --frozen --extra dev

      - name: Run Ruff
        run: .venv/bin/python -m ruff check .

      - name: Check formatting
        run: .venv/bin/python -m ruff format --check .

      - name: Run pytest
        run: .venv/bin/python -m pytest
